<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产教研合作 - UnitClaw.cn</title>
    <meta http-equiv="refresh" content="0;url=education.html#chanjiao">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accent: '#2563eb',
                        warm: '#d97706',
                        card: '#ffffff',
                        border: '#e2e8f0',
                        accent2: '#7c3aed',
                        dark: '#0F172A',
                        muted: '#64748B',
                        primary: '#ffffff',
                        secondary: '#f1f5f9',
                        light: '#3b82f6',
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans SC', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .glass{background:rgba(255,255,255,.9);backdrop-filter:blur(16px);border:1px solid rgba(0,0,0,.08)}
        .bg-grid{background-image:linear-gradient(rgba(37,99,235,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(37,99,235,.04) 1px,transparent 1px);background-size:40px 40px}
        .card-hover{transition:all .35s cubic-bezier(.4,0,.2,1)}
        .card-hover:hover{transform:translateY(-8px);box-shadow:0 20px 40px rgba(37,99,235,.10)}
        .text-gradient{background:linear-gradient(135deg,#2563eb,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .hero-glow{background:radial-gradient(ellipse at 50% 0%,rgba(37,99,235,.06) 0%,transparent 70%)}
        .tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:.75rem;font-weight:600;letter-spacing:.05em}
        .tag-robot{background:rgba(37,99,235,.08);color:#2563eb;border:1px solid rgba(37,99,235,.20)}
        .tag-course{background:rgba(124,58,237,.08);color:#7c3aed;border:1px solid rgba(124,58,237,.20)}
        .tag-claw{background:rgba(217,119,6,.08);color:#d97706;border:1px solid rgba(217,119,6,.20)}
        .tag-embedded{background:rgba(5,150,105,.08);color:#059669;border:1px solid rgba(5,150,105,.20)}
    </style>
</head>
<body class="bg-white text-gray-900 min-h-screen font-sans antialiased flex items-center justify-center">
    <div class="text-center max-w-md mx-auto px-6">
        <div class="w-16 h-16 bg-accent/10 rounded-2xl flex items-center justify-center mb-6 mx-auto">
            <i class="fas fa-handshake text-accent text-3xl"></i>
        </div>
        <h1 class="text-3xl font-bold mb-4"><span class="text-gradient">产教研合作</span></h1>
        <p class="text-gray-500 mb-8">产教研合作内容已合并至「高校合作」页面，点击下方按钮查看完整内容。</p>
        <a href="education.html#chanjiao" class="px-8 py-3.5 bg-accent hover:bg-blue-600 text-white font-semibold rounded-xl transition-all shadow-lg shadow-blue-600/25 inline-block">
            查看高校合作页面 <i class="fas fa-arrow-right ml-2"></i>
        </a>
        <script>
            // Auto redirect after 3 seconds
            setTimeout(function() { window.location.href = 'education.html#chanjiao'; }, 3000);
        </script>
    </div>

<script>
(function(){
  var css='.slogan-snow-wrap{position:relative;display:inline-block}.slogan-snow-particle{position:absolute;border-radius:50%;pointer-events:none;animation:snowDrift var(--dur,3s) ease-in-out infinite;animation-delay:var(--delay,0s);opacity:0}@keyframes snowDrift{0%{transform:translateY(6px) translateX(0) scale(.35);opacity:0}12%{opacity:var(--op,.65)}45%{transform:translateY(-5px) translateX(var(--dx,8px)) scale(var(--sc,1));opacity:var(--op,.65)}80%{opacity:var(--op,.65)}100%{transform:translateY(-20px) translateX(var(--dx2,-6px)) scale(.18);opacity:0}}';
  if(!document.getElementById('snow-particle-style')){
    var s=document.createElement('style');s.id='snow-particle-style';s.textContent=css;document.head.appendChild(s);
  }
  setTimeout(function(){
    document.querySelectorAll('.slogan-snow-wrap').forEach(function(c){
      if(c.querySelector('.slogan-snow-particle'))return;
      var r=c.getBoundingClientRect(),w=r.width||280,h=r.height||32;
      for(var i=0;i<18;i++){
        var p=document.createElement('span');p.className='slogan-snow-particle';
        var sz=2+Math.random()*3;
        p.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+(Math.random()*w)+'px;bottom:'+(Math.random()*h*.5)+'px;--dur:'+(2.2+Math.random()*3)+'s;--delay:'+(Math.random()*3.5)+'s;--dx:'+(-10+Math.random()*20)+'px;--dx2:'+(-8+Math.random()*16)+'px;--sc:'+(.45+Math.random()*.75)+';--op:'+(.35+Math.random()*.5)+';background:rgba(255,255,255,'+(.4+Math.random()*.45)+')';
        c.appendChild(p);
      }
    });
  },400);
})();
</script>
</body>
</html>
